<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem Conexão — Rhyme</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;600&family=Inter:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0b;
      color: #e4e4e7;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .blob {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
    }
    .blob-1 { background: #f97316; top: -80px; left: -80px; }
    .blob-2 { background: #3b82f6; bottom: -80px; right: -80px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      backdrop-filter: blur(12px);
    }

    .icon-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(249,115,22,0.12);
      border: 2px solid rgba(249,115,22,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(249,115,22,0.3); }
      50% { box-shadow: 0 0 0 16px rgba(249,115,22,0); }
    }

    .icon-ring svg {
      width: 36px;
      height: 36px;
      stroke: #f97316;
    }

    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      font-size: 0.9rem;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 24px;
      text-align: left;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status-text { font-size: 0.82rem; color: #71717a; }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: #f97316;
      color: white;
      margin-bottom: 12px;
    }
    .btn-primary:hover { background: #ea580c; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: #a1a1aa;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: #e4e4e7; }

    .logo {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #f97316;
      opacity: 0.7;
    }

    #retry-message {
      font-size: 0.78rem;
      color: #52525b;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <span class="logo">RHYME</span>

  <div class="card">
    <div class="icon-ring">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>Sem conexão</h1>
    <p>Não foi possível se conectar. Verifique sua rede e tente novamente. Algumas funções ficam disponíveis enquanto offline.</p>

    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Monitorando conexão...</span>
    </div>

    <button class="btn btn-primary" onclick="tryReload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Tentar novamente
    </button>

    <button class="btn btn-ghost" onclick="history.back()">
      Voltar
    </button>

    <p id="retry-message"></p>
  </div>

  <script>
    let retryCount = 0;

    function tryReload() {
      retryCount++;
      document.getElementById('retry-message').textContent = `Tentativa ${retryCount}...`;
      
      fetch('/').then(() => {
        window.location.reload();
      }).catch(() => {
        document.getElementById('retry-message').textContent = `Tentativa ${retryCount}: ainda sem conexão.`;
      });
    }

    // Monitor connectivity
    function updateStatus(online) {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      if (online) {
        dot.style.background = '#22c55e';
        dot.style.animation = 'none';
        text.textContent = 'Conexão detectada! Recarregando...';
        setTimeout(() => window.location.reload(), 1200);
      } else {
        dot.style.background = '#ef4444';
        dot.style.animation = 'blink 1.5s ease-in-out infinite';
        text.textContent = 'Aguardando conexão...';
      }
    }

    window.addEventListener('online', () => updateStatus(true));
    window.addEventListener('offline', () => updateStatus(false));

    // Check immediately
    if (navigator.onLine) {
      updateStatus(true);
    }
  </script>
</body>
</html>
