repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: npx oxlint
        language: system
        types: [javascript, jsx]
        pass_filenames: false

      - id: prettier-check
        name: prettier check
        entry: npx prettier --check .
        language: system
        pass_filenames: false
